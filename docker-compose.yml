version: '3.8'

services:
  logistics-postgres:
    image: postgres:16.3      # <--- هنا بنستخدم الصورة الجاهزة مباشرة
    container_name: logistics-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: